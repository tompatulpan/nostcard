<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="system-ui, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="400" fill="#fbfbfd"/>

  <text x="600" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">NostCard — the short version</text>

  <!-- Owner -->
  <rect x="60" y="90" width="280" height="130" rx="14" fill="#f0f6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="200" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">You (the owner)</text>
  <text x="200" y="158" text-anchor="middle" font-size="12" fill="#475569">your browser encrypts the card</text>
  <text x="200" y="176" text-anchor="middle" font-size="12" fill="#475569">and signs it with a Nostr key</text>

  <!-- Relays -->
  <rect x="460" y="90" width="280" height="130" rx="14" fill="#f7f4ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="600" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Public Nostr relays</text>
  <text x="600" y="158" text-anchor="middle" font-size="12" fill="#475569">store the encrypted card and see</text>
  <text x="600" y="176" text-anchor="middle" font-size="12" fill="#475569">only ciphertext — never the key</text>
  <text x="600" y="194" text-anchor="middle" font-size="12" fill="#475569">or your contact details</text>

  <!-- Recipient -->
  <rect x="860" y="90" width="280" height="130" rx="14" fill="#f0faf5" stroke="#059669" stroke-width="1.5"/>
  <text x="1000" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Anyone with the link</text>
  <text x="1000" y="158" text-anchor="middle" font-size="12" fill="#475569">their browser fetches and decrypts</text>
  <text x="1000" y="176" text-anchor="middle" font-size="12" fill="#475569">the card — no app, no account,</text>
  <text x="1000" y="194" text-anchor="middle" font-size="12" fill="#475569">works from any host</text>

  <!-- Relay flow arrows -->
  <line x1="345" y1="155" x2="455" y2="155" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <text x="400" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">publish</text>
  <text x="400" y="173" text-anchor="middle" font-size="10.5" fill="#475569">ciphertext</text>

  <line x1="745" y1="155" x2="855" y2="155" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <text x="800" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">fetch</text>
  <text x="800" y="173" text-anchor="middle" font-size="10.5" fill="#475569">ciphertext</text>

  <!-- Share-link path -->
  <line x1="200" y1="224" x2="200" y2="290" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="1000" y1="224" x2="1000" y2="290" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="160" y1="300" x2="1040" y2="300" stroke="#d97706" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arAmber)"/>
  <text x="600" y="283" text-anchor="middle" font-size="14" font-family="ui-monospace, Menlo, monospace" fill="#334155">https://any-host/card?<tspan fill="#7c3aed" font-weight="700">naddr=…</tspan>#<tspan fill="#d97706" font-weight="700">AES-key</tspan></text>
  <text x="600" y="327" text-anchor="middle" font-size="12" fill="#475569">The decryption key rides in the link's #fragment — the relays never see it.</text>

  <text x="600" y="365" text-anchor="middle" font-size="11.5" fill="#64748b">Rotate the key and old links stop working. Update the card and every shared link shows the latest version.</text>
</svg>
